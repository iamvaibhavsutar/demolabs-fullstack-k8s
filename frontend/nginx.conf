server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve React static build
    location / {
        try_files $uri /index.html;
    }

    # Reverse-proxy API calls to the backend Kubernetes Service (DNS name
    # resolves in-cluster: <svc>.<namespace>.svc.cluster.local)
    location /api/ {
        proxy_pass http://demolabs-backend-svc.demolabs.svc.cluster.local:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Lightweight endpoint for k8s probes so probes don't depend on /api (backend)
    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
