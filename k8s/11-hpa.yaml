# HPA needs metrics-server running in the cluster and needs resources.requests
# set on the target containers (already set above) - CPU% is calculated
# against the request, not the limit.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demolabs-backend-hpa
  namespace: demolabs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demolabs-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120   # don't flap - wait 2 min of low load before scaling down
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demolabs-frontend-hpa
  namespace: demolabs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demolabs-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
