apiVersion: apps/v1
kind: Deployment
metadata:
  name: demolabs-backend
  namespace: demolabs
  labels:
    app: demolabs-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demolabs-backend
  template:
    metadata:
      labels:
        app: demolabs-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          # Replace with your Harbor path, e.g. harbor.lyra.local/demolabs/demolabs-backend:1.0.0
          image: <YOUR_REGISTRY>/demolabs-backend:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: demolabs-backend-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: demolabs-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demolabs-db-secret
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false   # Spring Boot writes to /tmp at runtime
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            # JVM + Spring context boot can take a while under load;
            # gives it up to 90s (18 x 5s) before liveness probing kicks in.
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 18
